# .github/workflows/validate.yml

name: Validate Documents and JSON

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write  # ← обязательно для публикации в gh-pages

jobs:
  unit-tests:
    name: Unit-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        run: mvn --batch-mode test

      # Генерация Allure отчёта
      - name: Install Allure Command Line
        run: |
          wget -qO allure.zip https://github.com/qameta/allure-commandline/releases/download/2.25.0/allure-commandline-2.25.0.zip
          unzip -q allure.zip -d allure
          echo "$(pwd)/allure/allure-2.25.0/bin" >> $GITHUB_PATH

      - name: Generate Allure Report
        run: allure generate target/allure-results -o target/allure-report --clean

      # Публикация на GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/allure-report
          keep_files: true

  build:
    name: Анализ данных
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven (skip tests)
        run: mvn --batch-mode --show-version clean package -DskipTests
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: validator-jar
          path: target/*-jar-with-dependencies.jar
          retention-days: 1

  validate-docs-servis:
    name: Проверка документации
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: validator-jar
          path: target
      - name: Run validation
        run: java -jar target/*-jar-with-dependencies.jar docs-servis

  validate-check-list:
    name: Проверка чек-листа
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: validator-jar
          path: target
      - name: Run validation
        run: java -jar target/*-jar-with-dependencies.jar check-list

  validate-csv:
    name: Проверка нагрузочных скриптов
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: validator-jar
          path: target
      - name: Run validation
        run: java -jar target/*-jar-with-dependencies.jar csv

  validate-json:
    name: Проверка API тестов
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: validator-jar
          path: target
      - name: Run validation
        run: java -jar target/*-jar-with-dependencies.jar json
